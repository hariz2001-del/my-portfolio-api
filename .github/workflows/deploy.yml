name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: development
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN}}

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v3

        - name: Set up Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and Push
          uses: docker/build-push-action@v5
          with: 
            context: .
            platforms: linux/amd64
            push: true
            tags: ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    steps:
        - name: Deploy to server
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.SERVER_IP }}
            username: ${{ secrets.SERVER_USERNAME }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              docker pull ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest
              docker stop my-portfolio-api || true
              docker rm my-portfolio-api || true
              docker run -d --name my-portfolio-api -p 5001:5001 ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest
